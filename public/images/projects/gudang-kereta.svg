<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090f1d"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111c38"/>
      <stop offset="100%" stop-color="#0a1226"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>

  <!-- Subtle Grid Lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="675"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="500" y1="0" x2="500" y2="675"/>
    <line x1="700" y1="0" x2="700" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
    <line x1="1100" y1="0" x2="1100" y2="675"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <!-- Glowing background light -->
  <circle cx="200" cy="180" r="180" fill="rgba(245, 158, 11, 0.08)" filter="url(#glow)"/>
  <circle cx="1000" cy="400" r="220" fill="rgba(37, 99, 235, 0.08)" filter="url(#glow)"/>

  <!-- Main Container Card -->
  <rect x="50" y="45" width="1100" height="585" rx="20" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Top Window Header -->
  <rect x="50" y="45" width="1100" height="56" rx="20" fill="#0b1329"/>
  <rect x="50" y="80" width="1100" height="21" fill="#0b1329"/>
  <line x1="50" y1="101" x2="1150" y2="101" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Window Dots -->
  <circle cx="85" cy="73" r="6" fill="#ef4444"/>
  <circle cx="107" cy="73" r="6" fill="#f59e0b"/>
  <circle cx="129" cy="73" r="6" fill="#10b981"/>

  <!-- Header Title -->
  <text x="600" y="78" fill="#94a3b8" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1">
    GUDANG KERETA &middot; SISTEM MANAJEMEN ARMADA &amp; OPERASIONAL PERKERETAAPIAN
  </text>

  <!-- Badge System -->
  <rect x="80" y="135" width="150" height="30" rx="15" fill="rgba(245,158,11,0.15)" stroke="#f59e0b" stroke-width="1"/>
  <text x="155" y="155" fill="#f59e0b" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5">
    DIPO &amp; BALAI YASA
  </text>

  <!-- Title & Subtitle -->
  <text x="80" y="210" fill="#ffffff" font-family="'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
    Gudang Kereta Management System
  </text>
  <text x="80" y="240" fill="#94a3b8" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="400">
    Sistem Manajemen Armada, Kargo Tonase, Stamformasi Builder &amp; GAPEKA Nasional
  </text>

  <!-- 3 Metric Cards -->
  <!-- Card 1: Armada Loko -->
  <rect x="80" y="275" width="310" height="110" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="105" y="305" fill="#f59e0b" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.8">ARMADA LOKOMOTIF</text>
  <text x="105" y="342" fill="#ffffff" font-family="'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="800">CC 206 / CC 201</text>
  <text x="105" y="368" fill="#64748b" font-family="'Segoe UI', system-ui, sans-serif" font-size="12">Traksi Ganda &amp; Daya Tarik 2.800T</text>

  <!-- Card 2: Stamformasi -->
  <rect x="420" y="275" width="310" height="110" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="445" y="305" fill="#38bdf8" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.8">STAMFORMASI BUILDER</text>
  <text x="445" y="342" fill="#ffffff" font-family="'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="800">Safety Validator</text>
  <text x="445" y="368" fill="#64748b" font-family="'Segoe UI', system-ui, sans-serif" font-size="12">Kalkulasi Beban &amp; Rasio Otomatis</text>

  <!-- Card 3: Operasional GAPEKA -->
  <rect x="760" y="275" width="310" height="110" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="785" y="305" fill="#34d399" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.8">OPERASIONAL &amp; MANIFEST</text>
  <text x="785" y="342" fill="#ffffff" font-family="'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="800">Warta KA &amp; Surat Jalan</text>
  <text x="785" y="368" fill="#64748b" font-family="'Segoe UI', system-ui, sans-serif" font-size="12">Lembar Cetak Masinis &amp; PPKA</text>

  <!-- Visual Train Track Preview -->
  <rect x="80" y="415" width="990" height="115" rx="14" fill="#070d19" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="90" y1="495" x2="1060" y2="495" stroke="#334155" stroke-width="4"/>

  <!-- Train Car 1 (Locomotive) -->
  <rect x="105" y="432" width="160" height="52" rx="8" fill="url(#amberGrad)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="125" y="454" fill="#000000" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800">LOKOMOTIF 1</text>
  <text x="125" y="473" fill="#000000" font-family="monospace" font-size="13" font-weight="700">CC 206 13 01</text>
  <!-- Coupler -->
  <rect x="265" y="454" width="12" height="6" fill="#94a3b8"/>

  <!-- Train Car 2 (Eksekutif 1) -->
  <rect x="277" y="432" width="150" height="52" rx="8" fill="url(#blueGrad)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="295" y="454" fill="#ffffff" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="700">#1 EKSEKUTIF</text>
  <text x="295" y="473" fill="#ffffff" font-family="monospace" font-size="13" font-weight="700">K1 0 23 01</text>
  <!-- Coupler -->
  <rect x="427" y="454" width="12" height="6" fill="#94a3b8"/>

  <!-- Train Car 3 (Eksekutif 2) -->
  <rect x="439" y="432" width="150" height="52" rx="8" fill="url(#blueGrad)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="457" y="454" fill="#ffffff" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="700">#2 EKSEKUTIF</text>
  <text x="457" y="473" fill="#ffffff" font-family="monospace" font-size="13" font-weight="700">K1 0 23 02</text>
  <!-- Coupler -->
  <rect x="589" y="454" width="12" height="6" fill="#94a3b8"/>

  <!-- Train Car 4 (Restorasi) -->
  <rect x="601" y="432" width="150" height="52" rx="8" fill="#0f766e" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="619" y="454" fill="#ffffff" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="700">#3 RESTORASI</text>
  <text x="619" y="473" fill="#ffffff" font-family="monospace" font-size="13" font-weight="700">M1 0 23 01</text>
  <!-- Coupler -->
  <rect x="751" y="454" width="12" height="6" fill="#94a3b8"/>

  <!-- Train Car 5 (Pembangkit) -->
  <rect x="763" y="432" width="150" height="52" rx="8" fill="#15803d" stroke="#4ade80" stroke-width="1.5"/>
  <text x="781" y="454" fill="#ffffff" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="700">#4 PEMBANGKIT</text>
  <text x="781" y="473" fill="#ffffff" font-family="monospace" font-size="13" font-weight="700">P 0 23 01</text>
  <!-- Coupler -->
  <rect x="913" y="454" width="12" height="6" fill="#94a3b8"/>

  <!-- Train Car 6 (Bagasi) -->
  <rect x="925" y="432" width="135" height="52" rx="8" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="940" y="454" fill="#ffffff" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="700">#5 BAGASI</text>
  <text x="940" y="473" fill="#ffffff" font-family="monospace" font-size="13" font-weight="700">B 0 19 05</text>

  <!-- Bottom Tech Tags -->
  <g transform="translate(80, 560)">
    <!-- PHP -->
    <rect x="0" y="0" width="85" height="28" rx="6" fill="#1e293b"/>
    <text x="42" y="18" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">PHP 8.3</text>

    <!-- MySQL -->
    <rect x="95" y="0" width="105" height="28" rx="6" fill="#1e293b"/>
    <text x="147" y="18" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">MySQL 8.4</text>

    <!-- Bootstrap 5 -->
    <rect x="210" y="0" width="115" height="28" rx="6" fill="#1e293b"/>
    <text x="267" y="18" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Bootstrap 5.3</text>

    <!-- RBAC -->
    <rect x="335" y="0" width="95" height="28" rx="6" fill="#1e293b"/>
    <text x="382" y="18" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">RBAC Auth</text>

    <!-- GAPEKA -->
    <rect x="440" y="0" width="85" height="28" rx="6" fill="#1e293b"/>
    <text x="482" y="18" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">GAPEKA</text>

    <!-- Safety Engine -->
    <rect x="535" y="0" width="165" height="28" rx="6" fill="#1e293b"/>
    <text x="617" y="18" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Tonnage Safety Engine</text>
  </g>
</svg>

