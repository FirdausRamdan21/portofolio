<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="blueGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad2)"/>

  <!-- Subtle Grid Lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="675"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="500" y1="0" x2="500" y2="675"/>
    <line x1="700" y1="0" x2="700" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
    <line x1="1100" y1="0" x2="1100" y2="675"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <!-- Glowing light -->
  <circle cx="250" cy="180" r="200" fill="rgba(59, 130, 246, 0.08)" filter="url(#glow2)"/>
  <circle cx="950" cy="450" r="220" fill="rgba(16, 185, 129, 0.08)" filter="url(#glow2)"/>

  <!-- Main Container Card -->
  <rect x="50" y="45" width="1100" height="585" rx="20" fill="url(#cardGrad2)" stroke="#1e293b" stroke-width="2"/>

  <!-- Top Window Header -->
  <rect x="50" y="45" width="1100" height="56" rx="20" fill="#0b1329"/>
  <rect x="50" y="80" width="1100" height="21" fill="#0b1329"/>
  <line x1="50" y1="101" x2="1150" y2="101" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Window Dots -->
  <circle cx="85" cy="73" r="6" fill="#ef4444"/>
  <circle cx="107" cy="73" r="6" fill="#f59e0b"/>
  <circle cx="129" cy="73" r="6" fill="#10b981"/>

  <!-- Header Title -->
  <text x="600" y="78" fill="#94a3b8" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1">
    SERVICEHUB &middot; SISTEM MANAJEMEN TIKET SERVICE &amp; SURAT JALAN LOGISTIK
  </text>

  <!-- Badge System -->
  <rect x="80" y="135" width="165" height="30" rx="15" fill="rgba(59,130,246,0.15)" stroke="#3b82f6" stroke-width="1"/>
  <text x="162" y="155" fill="#60a5fa" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5">
    ENTERPRISE SYSTEM
  </text>

  <!-- Title & Subtitle -->
  <text x="80" y="210" fill="#ffffff" font-family="'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
    ServiceHub &amp; Surat Jalan Management
  </text>
  <text x="80" y="240" fill="#94a3b8" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="400">
    Pelacakan Tiket Perbaikan, Manajemen Klien, Logistik Sparepart &amp; Penerbitan Surat Jalan Otomatis
  </text>

  <!-- 3 Metric Cards -->
  <!-- Card 1 -->
  <rect x="80" y="275" width="310" height="110" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="105" y="305" fill="#38bdf8" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.8">TIKET SERVICE MASUK</text>
  <text x="105" y="342" fill="#ffffff" font-family="'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="800">Tiket Otomatis</text>
  <text x="105" y="368" fill="#64748b" font-family="'Segoe UI', system-ui, sans-serif" font-size="12">Prefix ID Unik &amp; Tracking Real-Time</text>

  <!-- Card 2 -->
  <rect x="420" y="275" width="310" height="110" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="445" y="305" fill="#10b981" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.8">SURAT JALAN &amp; INVOICE</text>
  <text x="445" y="342" fill="#ffffff" font-family="'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="800">Dokumen Cetak</text>
  <text x="445" y="368" fill="#64748b" font-family="'Segoe UI', system-ui, sans-serif" font-size="12">Format Standar Serah Terima Klien</text>

  <!-- Card 3 -->
  <rect x="760" y="275" width="310" height="110" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="785" y="305" fill="#f59e0b" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.8">DATABASE &amp; INTEGRITAS</text>
  <text x="785" y="342" fill="#ffffff" font-family="'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="800">MySQL &amp; Relasional</text>
  <text x="785" y="368" fill="#64748b" font-family="'Segoe UI', system-ui, sans-serif" font-size="12">Multi-Klien, Sparepart &amp; Riwayat Garansi</text>

  <!-- Table Preview Section -->
  <rect x="80" y="415" width="990" height="115" rx="14" fill="#070d19" stroke="#1e293b" stroke-width="1.5"/>
  <g transform="translate(100, 440)">
    <rect x="0" y="0" width="950" height="30" rx="6" fill="#1e293b"/>
    <text x="20" y="20" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">NO TIKET</text>
    <text x="180" y="20" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">NAMA KLIEN</text>
    <text x="400" y="20" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">JENIS BARANG</text>
    <text x="650" y="20" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">STATUS SERVIS</text>
    <text x="850" y="20" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">SURAT JALAN</text>

    <!-- Row 1 -->
    <text x="20" y="55" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">TIK-202611-001</text>
    <text x="180" y="55" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="12">PT Sinar Mentari</text>
    <text x="400" y="55" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="12">Inverter &amp; Power Supply</text>
    <rect x="650" y="40" width="80" height="22" rx="4" fill="rgba(16,185,129,0.2)"/>
    <text x="690" y="55" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Selesai</text>
    <text x="850" y="55" fill="#f59e0b" font-family="monospace" font-size="12">SJS-2026-089</text>
  </g>

  <!-- Bottom Tech Tags -->
  <g transform="translate(80, 560)">
    <rect x="0" y="0" width="85" height="28" rx="6" fill="#1e293b"/>
    <text x="42" y="18" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">PHP Native</text>

    <rect x="95" y="0" width="85" height="28" rx="6" fill="#1e293b"/>
    <text x="137" y="18" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">MySQL</text>

    <rect x="190" y="0" width="105" height="28" rx="6" fill="#1e293b"/>
    <text x="242" y="18" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Bootstrap 5</text>

    <rect x="305" y="0" width="125" height="28" rx="6" fill="#1e293b"/>
    <text x="367" y="18" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Surat Jalan Cetak</text>

    <rect x="440" y="0" width="105" height="28" rx="6" fill="#1e293b"/>
    <text x="492" y="18" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">RESTful API</text>

    <rect x="555" y="0" width="125" height="28" rx="6" fill="#1e293b"/>
    <text x="617" y="18" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">PDF Generator</text>
  </g>
</svg>

